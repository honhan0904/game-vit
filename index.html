<title>🎪 Máy Gắp Thú Bông 🎪</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
/* === RESET & GLOBAL === */
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:linear-gradient(180deg,#0f0c29,#302b63,#24243e);
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-family:'Baloo 2',cursive,sans-serif;
  overflow-x:hidden;padding:10px;user-select:none;
}

/* === STARS === */
.star{
  position:fixed;width:3px;height:3px;background:#fff;border-radius:50%;
  animation:twinkle 2s ease-in-out infinite;pointer-events:none;
}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}

/* === SCOREBOARD === */
.score-board{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;justify-content:center}
.score-item{
  background:linear-gradient(135deg,#667eea,#764ba2);
  padding:6px 18px;border-radius:22px;color:#fff;
  font-size:15px;font-weight:700;
  box-shadow:0 4px 15px rgba(102,126,234,.4);
}

/* === MUSIC BUTTON === */
.music-btn{
  position:fixed;top:14px;right:14px;z-index:60;
  width:48px;height:48px;border-radius:50%;
  background:linear-gradient(135deg,#667eea,#764ba2);
  border:3px solid rgba(255,255,255,.2);color:#fff;
  font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;box-shadow:0 4px 15px rgba(102,126,234,.4);
}
.music-btn:hover{transform:scale(1.1);border-color:rgba(255,255,255,.5)}
.music-btn.muted{opacity:.5}

/* === MACHINE HEADER === */
.machine{position:relative;width:520px;max-width:96vw}
.m-header{
  background:linear-gradient(180deg,#ff4757,#c0392b);
  padding:12px 15px 8px;border-radius:20px 20px 0 0;
  text-align:center;border:5px solid #a93226;border-bottom:none;
  box-shadow:0 -5px 30px rgba(255,71,87,.4);position:relative;overflow:hidden;
}
.m-header::before{
  content:'';position:absolute;top:0;left:-50%;width:200%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);
  animation:headerShine 4s linear infinite;
}
@keyframes headerShine{0%{transform:translateX(-50%)}100%{transform:translateX(50%)}}
.m-title{
  font-size:24px;font-weight:800;color:#ffe66d;
  text-shadow:2px 2px 4px rgba(0,0,0,.4),0 0 20px rgba(255,230,100,.3);
  letter-spacing:1px;position:relative;
}
.lights{display:flex;justify-content:center;gap:7px;margin-top:6px}
.bulb{width:10px;height:10px;border-radius:50%;animation:blinkB 1.5s ease-in-out infinite}
.bulb:nth-child(4n){background:#ffe66d}
.bulb:nth-child(4n+1){background:#4ecdc4}
.bulb:nth-child(4n+2){background:#ff6b9d}
.bulb:nth-child(4n+3){background:#a29bfe}
@keyframes blinkB{0%,100%{opacity:1;box-shadow:0 0 8px 3px currentColor}50%{opacity:.2;box-shadow:none}}

/* === MACHINE BODY & GLASS === */
.m-body{
  background:linear-gradient(180deg,#2c3e50,#34495e);
  border-left:5px solid #a93226;border-right:5px solid #a93226;
  position:relative;
}
.glass{
  position:relative;height:420px;margin:6px;
  background:linear-gradient(180deg,#0a0a20 0%,#111130 40%,#181845 70%,#202058 100%);
  border:3px solid rgba(255,255,255,.07);border-radius:6px;
  overflow:hidden;cursor:crosshair;
}
.glass-shine{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background:linear-gradient(118deg,transparent 28%,rgba(255,255,255,.03) 36%,
              rgba(255,255,255,.06) 44%,rgba(255,255,255,.03) 52%,transparent 60%);
  pointer-events:none;z-index:20;
}
.floor{
  position:absolute;bottom:0;left:0;right:0;height:14px;
  background:linear-gradient(180deg,#35355a,#28284a);
  z-index:1;box-shadow:0 -2px 8px rgba(0,0,0,.2);
}

/* === RAIL & CLAW === */
.rail{
  position:absolute;top:0;left:0;right:0;height:14px;
  background:linear-gradient(180deg,#6b7b8d,#ccd5db,#a0adb8);
  z-index:10;box-shadow:0 3px 8px rgba(0,0,0,.35);
}
.rail::before,.rail::after{
  content:'';position:absolute;top:3px;
  width:8px;height:8px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#bbb,#777);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.3);
}
.rail::before{left:8px}
.rail::after{right:8px}

.claw-sys{
  position:absolute;top:14px;left:50%;z-index:9;
  display:flex;flex-direction:column;align-items:center;
  transform:translateX(-50%);
  transition:left .7s cubic-bezier(.4,0,.2,1);
}
.claw-trolley{
  width:28px;height:12px;
  background:linear-gradient(180deg,#7f8c8d,#bdc3c7,#95a5a6);
  border-radius:3px 3px 1px 1px;
  box-shadow:0 2px 5px rgba(0,0,0,.3);position:relative;z-index:2;
}
.claw-trolley::before,.claw-trolley::after{
  content:'';position:absolute;bottom:-2px;
  width:6px;height:6px;border-radius:50%;background:#636e72;
}
.claw-trolley::before{left:2px}
.claw-trolley::after{right:2px}
.claw-cable{
  width:5px;
  background:repeating-linear-gradient(180deg,#6b7b8d 0px,#6b7b8d 4px,#a0adb8 4px,#a0adb8 8px);
  border-radius:2px;height:18px;
  transition:height .5s ease-in-out;
  box-shadow:1px 0 3px rgba(0,0,0,.2);position:relative;
}
.claw-cable::after{
  content:'';position:absolute;left:0;top:0;
  width:1.5px;height:100%;background:rgba(255,255,255,.15);
}
.claw-svg{display:block;margin-top:-2px;overflow:visible}
#armL,#armR{transform-origin:40px 34px;transition:transform .35s ease}

/* === PLUSH TOYS === */
#animalsArea{position:absolute;top:85px;left:6px;right:6px;bottom:16px}
.plush{
  position:absolute;cursor:pointer;z-index:3;transition:filter .2s;
}
.plush:hover{
  filter:brightness(1.2) drop-shadow(0 0 12px rgba(255,255,255,.4));z-index:5;
}
.plush canvas{pointer-events:none;image-rendering:auto}
.plush-shadow{
  position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);
  width:48px;height:9px;
  background:radial-gradient(ellipse,rgba(0,0,0,.3),transparent);
  border-radius:50%;
}

/* === SCREWS === */
.screw{
  position:absolute;width:12px;height:12px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#aaa,#666);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.3),0 1px 3px rgba(0,0,0,.4);
  z-index:5;
}
.screw::after{
  content:'';position:absolute;top:5px;left:2px;
  width:8px;height:2px;background:rgba(0,0,0,.35);border-radius:1px;
}

/* === MACHINE BASE === */
.m-base{
  background:linear-gradient(180deg,#b83227,#e74c3c 40%,#c0392b);
  border:5px solid #a93226;border-top:none;border-radius:0 0 20px 20px;
  padding:14px;display:flex;align-items:center;justify-content:center;gap:14px;
}
.base-label{
  color:#ffe66d;font-size:14px;font-weight:700;
  text-shadow:1px 1px 2px rgba(0,0,0,.3);
}
.coin-slot{
  width:35px;height:8px;background:#2d3436;
  border-radius:4px;border:2px solid #636e72;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.6);
}

/* === PRIZES ROW === */
.prizes{
  margin-top:10px;display:flex;gap:5px;flex-wrap:wrap;
  justify-content:center;max-width:520px;min-height:42px;
}
.prize-item{
  animation:prizeIn .5s cubic-bezier(.68,-.55,.265,1.55);
  border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.3);
}
@keyframes prizeIn{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}

/* === TOAST === */
.toast{
  position:fixed;top:16%;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.88);color:#fff;padding:12px 26px;
  border-radius:16px;font-size:17px;font-weight:700;z-index:50;
  animation:toastA 2.5s forwards;pointer-events:none;white-space:nowrap;
  box-shadow:0 8px 30px rgba(0,0,0,.4);
}
@keyframes toastA{
  0%{opacity:0;transform:translateX(-50%) translateY(-20px) scale(.9)}
  10%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  78%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-15px)}
}

/* === QUESTION MODAL === */
.overlay{
  display:none;position:fixed;top:0;left:0;
  width:100%;height:100%;background:rgba(0,0,0,.78);
  z-index:100;align-items:center;justify-content:center;
  backdrop-filter:blur(5px);
}
.overlay.active{display:flex}
.q-modal{
  background:linear-gradient(135deg,#667eea,#764ba2);
  border-radius:26px;padding:30px 28px;max-width:480px;width:92%;
  text-align:center;color:#fff;
  box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 40px rgba(102,126,234,.25);
  animation:mIn .45s cubic-bezier(.68,-.55,.265,1.55);
}
@keyframes mIn{0%{transform:scale(.3) translateY(40px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.m-animal-wrap{margin:0 auto;animation:mBounce 1s ease-in-out infinite}
.m-animal-wrap canvas{border-radius:50%;box-shadow:0 4px 20px rgba(0,0,0,.3)}
@keyframes mBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.m-congrats{font-size:22px;font-weight:800;margin:10px 0 4px}
.m-question-box{
  background:rgba(255,255,255,.13);border-radius:18px;
  padding:20px 22px;margin:14px 0 22px;
  font-size:21px;font-weight:700;line-height:1.6;
  text-align:center;letter-spacing:.3px;
  border:2px solid rgba(255,255,255,.18);
}
.m-question-box .q-icon{font-size:32px;display:block;margin-bottom:8px}
.m-question-box .q-text{display:block}
.m-close-btn{
  padding:14px 48px;
  background:linear-gradient(135deg,#f39c12,#e67e22);
  border:none;border-radius:30px;color:#fff;
  font-size:18px;font-weight:700;cursor:pointer;
  font-family:inherit;transition:all .2s;
  box-shadow:0 4px 15px rgba(243,156,18,.4);
}
.m-close-btn:hover{transform:scale(1.06);box-shadow:0 6px 20px rgba(243,156,18,.6)}

/* === CONFETTI === */
.confetti{
  position:fixed;top:-10px;z-index:200;pointer-events:none;
  animation:cFall var(--ft) linear forwards;
}
@keyframes cFall{
  0%{transform:translateY(0) rotate(0) scale(1);opacity:1}
  100%{transform:translateY(100vh) rotate(var(--rot)) scale(.4);opacity:0}
}

/* === HINT === */
.hint{color:rgba(255,255,255,.4);font-size:13px;margin-top:8px;text-align:center}

/* === RESPONSIVE === */
@media(max-width:540px){
  .machine{width:98vw}
  .glass{height:360px}
  .m-title{font-size:19px}
  .score-item{font-size:13px;padding:4px 12px}
  .q-modal{padding:22px 16px}
  .m-question-box{font-size:18px;padding:16px 14px}
  .m-close-btn{font-size:16px;padding:12px 36px}
}
</style>
</head>

<body>

<button class="music-btn muted" id="musicBtn" title="Bật/Tắt nhạc">🔇</button>

<div style="display:flex;flex-direction:column;align-items:center;position:relative;z-index:1">

  <div class="score-board">
    <div class="score-item">🎯 Lượt gắp: <span id="count">0</span></div>
  </div>

  <div class="machine">
    <div class="m-header">
      <div class="m-title">✨ MÁY GẮP THÚ BÔNG ✨</div>
      <div class="lights" id="lights"></div>
    </div>

    <div class="m-body">
      <div class="screw" style="top:7px;left:7px"></div>
      <div class="screw" style="top:7px;right:7px"></div>
      <div class="screw" style="bottom:7px;left:7px"></div>
      <div class="screw" style="bottom:7px;right:7px"></div>

      <div class="glass" id="glass">
        <div class="glass-shine"></div>
        <div class="floor"></div>
        <div class="rail"></div>

        <div class="claw-sys" id="clawSys">
          <div class="claw-trolley"></div>
          <div class="claw-cable" id="clawCable"></div>

          <!-- ===== CLAW SVG (thiết kế liền mạch) ===== -->
          <svg class="claw-svg" width="80" height="82" viewBox="0 0 80 82">
            <defs>
              <linearGradient id="mtl" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#6b7b8d"></stop>
                <stop offset="30%" stop-color="#ccd5db"></stop>
                <stop offset="70%" stop-color="#ccd5db"></stop>
                <stop offset="100%" stop-color="#6b7b8d"></stop>
              </linearGradient>
              <radialGradient id="tipG">
                <stop offset="0%" stop-color="#ff6b6b"></stop>
                <stop offset="100%" stop-color="#c0392b"></stop>
              </radialGradient>
            </defs>

            <!-- Connector plate (nối với cable) -->
            <rect x="33" y="0" width="14" height="9" rx="3" fill="url(#mtl)"></rect>

            <!-- Housing (vỏ máy gắp) -->
            <rect x="12" y="7" width="56" height="22" rx="9" fill="#c0392b" stroke="#8e1d1d" stroke-width="1.2"></rect>
            <rect x="17" y="11" width="46" height="9" rx="4.5" fill="#e74c3c" opacity=".7"></rect>
            <circle cx="40" cy="23" r="2.5" fill="#f1c40f">
              <animate attributeName="opacity" values="1;.3;1" dur="1.2s" repeatCount="indefinite"></animate>
            </circle>

            <!-- Neck (cổ nối housing → hub) -->
            <rect x="34" y="28" width="12" height="8" rx="2.5" fill="url(#mtl)"></rect>

            <!-- Hub / Pivot (trục xoay – tất cả cánh tay nối vào đây) -->
            <circle cx="40" cy="40" r="8" fill="#636e72" stroke="#4a5568" stroke-width="1.5"></circle>
            <circle cx="40" cy="40" r="5" fill="#4a5568"></circle>
            <circle cx="40" cy="40" r="2.5" fill="#596570"></circle>

            <!-- Left Arm (cánh tay trái) -->
            <g id="armL">
              <line x1="40" y1="40" x2="40" y2="40" stroke="url(#mtl)" stroke-width="6" stroke-linecap="round"></line>
              <path d="M40,40 C35,50 27,60 20,70" stroke="url(#mtl)" stroke-width="6" fill="none" stroke-linecap="round"></path>
              <ellipse cx="19" cy="72" rx="7" ry="5.5" fill="url(#tipG)" stroke="#a93226" stroke-width="1"></ellipse>
              <ellipse cx="18" cy="70" rx="3.5" ry="2" fill="rgba(255,255,255,.22)"></ellipse>
            </g>

            <!-- Center Arm (cánh tay giữa) -->
            <g id="armC">
              <path d="M40,40 L40,70" stroke="url(#mtl)" stroke-width="6" fill="none" stroke-linecap="round"></path>
              <ellipse cx="40" cy="72" rx="7" ry="5.5" fill="url(#tipG)" stroke="#a93226" stroke-width="1"></ellipse>
              <ellipse cx="39" cy="70" rx="3.5" ry="2" fill="rgba(255,255,255,.22)"></ellipse>
            </g>

            <!-- Right Arm (cánh tay phải) -->
            <g id="armR">
              <line x1="40" y1="40" x2="40" y2="40" stroke="url(#mtl)" stroke-width="6" stroke-linecap="round"></line>
              <path d="M40,40 C45,50 53,60 60,70" stroke="url(#mtl)" stroke-width="6" fill="none" stroke-linecap="round"></path>
              <ellipse cx="61" cy="72" rx="7" ry="5.5" fill="url(#tipG)" stroke="#a93226" stroke-width="1"></ellipse>
              <ellipse cx="60" cy="70" rx="3.5" ry="2" fill="rgba(255,255,255,.22)"></ellipse>
            </g>
          </svg>
        </div>

        <div id="animalsArea"></div>
      </div>
    </div>

    <div class="m-base">
      <div class="coin-slot"></div>
      <div class="base-label">👆 CLICK THÚ BÔNG ĐỂ GẮP!</div>
      <div class="coin-slot"></div>
    </div>
  </div>

  <div class="prizes" id="prizes"></div>
  <p class="hint">🎮 Click vào con thú bông bên trong máy!</p>
</div>

<!-- Modal câu hỏi -->
<div class="overlay" id="overlay">
  <div class="q-modal">
    <div class="m-animal-wrap" id="mAnimal"></div>
    <div class="m-congrats" id="mCongrats"></div>
    <div class="m-question-box">
      <span class="q-icon">🧠</span>
      <span class="q-text" id="mQText"></span>
    </div>
    <button class="m-close-btn" id="mClose">Đóng ✕</button>
  </div>
</div>

<script>
/* ===========================
   1. CANVAS DRAWING HELPERS
   =========================== */
const PI2=Math.PI*2;
function fc(c,cx,cy,r){c.beginPath();c.arc(cx,cy,r,0,PI2);c.fill()}
function fel(c,cx,cy,rx,ry){c.beginPath();c.ellipse(cx,cy,rx,ry,0,0,PI2);c.fill()}
function rRect(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);
  c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);
  c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);
  c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);
  c.quadraticCurveTo(x,y,x+r,y);c.closePath();c.fill();
}
function tri(c,x1,y1,x2,y2,x3,y3){
  c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.lineTo(x3,y3);c.closePath();c.fill();
}
function bGrad(c,cx,cy,r,l,d){
  const g=c.createRadialGradient(cx-r*.2,cy-r*.25,r*.08,cx,cy,r);
  g.addColorStop(0,l);g.addColorStop(1,d);c.fillStyle=g;fc(c,cx,cy,r);
}
function drawEyes(c,cx,cy,sz,style){
  sz=sz||5;style=style||'round';
  if(style==='round'){
    c.fillStyle='#1a1a2e';fc(c,cx-12,cy-5,sz);fc(c,cx+12,cy-5,sz);
    c.fillStyle='#fff';fc(c,cx-13.5,cy-6.8,sz*.45);fc(c,cx+10.5,cy-6.8,sz*.45);
    c.fillStyle='rgba(255,255,255,.4)';fc(c,cx-10.5,cy-4,sz*.22);fc(c,cx+13.5,cy-4,sz*.22);
  }else if(style==='panda'){
    c.fillStyle='#1a1a2e';fel(c,cx-12,cy-4,11,9);fel(c,cx+12,cy-4,11,9);
    c.fillStyle='#fff';fc(c,cx-12,cy-5,5);fc(c,cx+12,cy-5,5);
    c.fillStyle='#1a1a2e';fc(c,cx-12,cy-4.5,3);fc(c,cx+12,cy-4.5,3);
    c.fillStyle='#fff';fc(c,cx-13.5,cy-6,1.5);fc(c,cx+10.5,cy-6,1.5);
  }
}
function drawBlush(c,cx,cy,col){
  c.fillStyle=col||'rgba(255,130,130,.35)';
  fel(c,cx-19,cy+2,7,4.5);fel(c,cx+19,cy+2,7,4.5);
}
function drawSmile(c,cx,cy,w){
  w=w||7;c.strokeStyle='rgba(40,20,10,.45)';c.lineWidth=2;c.lineCap='round';
  c.beginPath();c.moveTo(cx-w,cy);c.quadraticCurveTo(cx,cy+w*.8,cx+w,cy);c.stroke();
}
function drawStitch(c,cx,cy){
  c.strokeStyle='rgba(0,0,0,.1)';c.lineWidth=1.2;c.setLineDash([3,3]);
  c.beginPath();c.moveTo(cx-14,cy);c.lineTo(cx+14,cy);c.stroke();c.setLineDash([]);
}
function addPlushTexture(c,w,h){
  c.globalCompositeOperation='source-atop';
  for(let i=0;i<80;i++){
    c.fillStyle='rgba(255,255,255,'+Math.random()*.05+')';
    fc(c,Math.random()*w,Math.random()*h,Math.random()*2.5+.5);
  }

/* ===========================

let audioCtx=null;
function getAudio(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function playSound(t){
  try{
    const ctx=getAudio(),now=ctx.currentTime;
    if(t==='move'){
      const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);
      o.type='sawtooth';o.frequency.setValueAtTime(120,now);o.frequency.linearRampToValueAtTime(350,now+.4);
      g.gain.setValueAtTime(.04,now);g.gain.linearRampToValueAtTime(0,now+.4);o.start();o.stop(now+.4);
    }else if(t==='descend'){
      const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);
      o.type='sine';o.frequency.setValueAtTime(480,now);o.frequency.linearRampToValueAtTime(120,now+.45);
      g.gain.setValueAtTime(.05,now);g.gain.linearRampToValueAtTime(0,now+.45);o.start();o.stop(now+.45);
    }else if(t==='grab'){
      const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);
      o.type='square';o.frequency.setValueAtTime(100,now);o.frequency.setValueAtTime(260,now+.04);
      g.gain.setValueAtTime(.07,now);g.gain.exponentialRampToValueAtTime(.001,now+.2);o.start();o.stop(now+.2);
    }else if(t==='success'){
      [523,659,784,1047].forEach((f,i)=>{
        const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);
        o.type='sine';const s=now+i*.12;o.frequency.setValueAtTime(f,s);
        g.gain.setValueAtTime(.1,s);g.gain.exponentialRampToValueAtTime(.001,s+.16);o.start(s);o.stop(s+.16);
      });
    }
  }catch(e){}
}

/* ===========================
   7. BACKGROUND MUSIC
   =========================== */
class BGMusic{
  constructor(){this.playing=false;this.ctx=null;this.masterGain=null;this.loopTimer=null}
  start(){
    if(this.playing)return;
    this.ctx=new(window.AudioContext||window.webkitAudioContext)();
    this.masterGain=this.ctx.createGain();this.masterGain.gain.value=.06;
    this.masterGain.connect(this.ctx.destination);this.playing=true;this._loop();
  }
  _loop(){
    if(!this.playing)return;
    const ctx=this.ctx,now=ctx.currentTime+.05,bpm=140,beat=60/bpm;
    const mel=[523,587,659,784,880,784,659,587,523,659,784,880,1047,880,784,659,
               440,523,587,659,784,659,587,523,392,440,523,659,523,440,392,440];
    const bas=[131,131,165,165,175,175,196,196,131,131,165,165,175,175,196,196,
               110,110,131,131,165,165,131,131,98,98,110,110,131,131,110,110];
    const loopLen=mel.length*beat;
    mel.forEach((freq,i)=>{
      const t=now+i*beat;
      const oM=ctx.createOscillator(),gM=ctx.createGain();oM.connect(gM);gM.connect(this.masterGain);
      oM.type='triangle';oM.frequency.setValueAtTime(freq,t);
      gM.gain.setValueAtTime(.35,t);gM.gain.exponentialRampToValueAtTime(.01,t+beat*.85);
      oM.start(t);oM.stop(t+beat*.9);
      const oB=ctx.createOscillator(),gB=ctx.createGain();oB.connect(gB);gB.connect(this.masterGain);
      oB.type='sine';oB.frequency.setValueAtTime(bas[i],t);
      gB.gain.setValueAtTime(.5,t);gB.gain.exponentialRampToValueAtTime(.01,t+beat*.9);
      oB.start(t);oB.stop(t+beat*.95);
      if(i%4===0){
        const oC=ctx.createOscillator(),gC=ctx.createGain();oC.connect(gC);gC.connect(this.masterGain);
        oC.type='sine';oC.frequency.setValueAtTime(freq*2,t);
        gC.gain.setValueAtTime(.12,t);gC.gain.exponentialRampToValueAtTime(.001,t+beat*1.5);
        oC.start(t);oC.stop(t+beat*1.6);
      }
    });
    this.loopTimer=setTimeout(()=>this._loop(),loopLen*1000-200);
  }
  stop(){
    this.playing=false;
    if(this.loopTimer)clearTimeout(this.loopTimer);
    if(this.ctx){try{this.ctx.close();}catch(e){}}this.ctx=null;
  }
  toggle(){if(this.playing)this.stop();else this.start();return this.playing}
}

/* ===========================
   10. PLACE ANIMALS (lớn hơn)
   =========================== */
function placeAnimals(){
  const area=document.getElementById('animalsArea');
  area.innerHTML='';
  const W=area.offsetWidth||440,H=area.offsetHeight||290;
  const isMob=W<360;
  const dispW=isMob?68:82;
  const dispH=Math.round(dispW*CH/CW);
  const num=isMob?6:8;
  const shuffled=[...ANIMALS].sort(()=>Math.random()-.5);
  const placed=[];
  for(let i=0;i<num;i++){
    const type=shuffled[i%shuffled.length];
    let px,py,att=0;
    do{
      px=Math.random()*(W-dispW-4)+2;
      py=H-dispH-6-Math.pow(Math.random(),.6)*(H*.45);
      att++;
    }while(att<30&&placed.some(p=>Math.abs(p.x-px)<dispW*.52&&Math.abs(p.y-py)<dispH*.48));
    placed.push({x:px,y:py});

    const rot=(Math.random()-.5)*30;
    const el=document.createElement('div');
    el.className='plush';
    el.style.cssText='left:'+px+'px;top:'+py+'px;transform:rotate('+rot+'deg);z-index:'+Math.floor(py)+';';

    const cv=document.createElement('canvas');
    cv.width=CW;cv.height=CH;
    cv.style.width=dispW+'px';cv.style.height=dispH+'px';
    cv.getContext('2d').drawImage(animalCanvases[type.id],0,0);

    const sh=document.createElement('div');sh.className='plush-shadow';
    el.appendChild(cv);el.appendChild(sh);
    el.dataset.id=type.id;el.dataset.name=type.name;
    el.addEventListener('click',()=>startGrab(el,type));
    area.appendChild(el);
  }
}

/* ===========================
   11. GRAB ANIMATION
   =========================== */
async function startGrab(el,type){
  if(isGrabbing)return;
  isGrabbing=true;

  const glass=document.getElementById('glass');
  const claw=document.getElementById('clawSys');
  const cable=document.getElementById('clawCable');
  const gr=glass.getBoundingClientRect();
  const ar=el.getBoundingClientRect();
  const tx=ar.left-gr.left+ar.width/2;
  const ty=ar.top-gr.top;

  setClawOpen(true);playSound('move');
  claw.style.left=tx+'px';
  await wait(780);

  playSound('descend');
  cable.style.height=Math.max(18,ty-75)+'px';
  await wait(600);

  playSound('grab');setClawOpen(false);
  el.style.transition='transform .15s';
  el.style.transform+=' scale(1.15)';
  await wait(400);

  cable.style.height='18px';
  el.style.transition='top .55s ease-in,opacity .45s ease .08s';
  el.style.top='-80px';el.style.opacity='0';
  playSound('success');
  await wait(700);

  claw.style.left='50%';setClawOpen(true);
  el.remove();

  collected.push(type);
  document.getElementById('count').textContent=collected.length;

  const pr=document.createElement('canvas');
  pr.width=CW;pr.height=CH;
  pr.style.width='38px';pr.style.height=Math.round(38*CH/CW)+'px';
  pr.className='prize-item';
  pr.getContext('2d').drawImage(animalCanvases[type.id],0,0);
  document.getElementById('prizes').appendChild(pr);

  await wait(400);
  spawnConfetti();
  showQuestion(type);
  checkRefill();
}

function checkRefill(){
  if(document.querySelectorAll('#animalsArea .plush').length<=2){
    setTimeout(placeAnimals,700);
  }
}

  if(!avail.length){usedQ=[];avail=QUESTIONS.map((_,i)=>i);}
  const qi=avail[Math.floor(Math.random()*avail.length)];
  usedQ.push(qi);

  const ad=document.getElementById('mAnimal');

  cv.style.width='90px';cv.style.height=Math.round(90*CH/CW)+'px';

  document.getElementById('mQText').textContent=QUESTIONS[qi].text;

  document.getElementById('overlay').classList.add('active');
}
